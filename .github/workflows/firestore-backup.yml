name: Firestore backup

on:
  schedule:
    # Every 4 hours. Cron is UTC; adjust here if you want a different cadence
    # (e.g. tighter during Aug 15-16 IST daytime, looser otherwise).
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backup script dependencies
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Snapshot Firestore
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_BACKUP_SERVICE_ACCOUNT_KEY }}
        run: node backup-firestore.mjs

      - name: Commit backup if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-backups/
          if git diff --cached --quiet; then
            echo "No changes to back up."
          else
            git commit -m "Automated Firestore backup"
            git push
          fi
